model:
  default_path: weights/best.pt
  confidence_threshold: 0.15
  iou_threshold: 0.45
  device: auto
window:
  default:
    left: 0
    top: 0
    width: 2561
    height: 1601
  presets:
    small:
      left: 100
      top: 100
      width: 640
      height: 480
    medium:
      left: 100
      top: 100
      width: 800
      height: 600
    large:
      left: 100
      top: 100
      width: 1200
      height: 800
    fullhd:
      left: 0
      top: 100
      width: 1920
      height: 980
    qhd:
      left: 320
      top: 180
      width: 1280
      height: 720
controls:
  pickup_key: space
  interact_key: space
  attack_key: z
  attack_method: key
  movement_keys:
    left: left
    right: right
    jump: x
    up: up
    down: down
  skill_keys:
    skill_1: ctrl
    skill_2: '1'
    skill_3: '2'
    skill_4: '3'
    potion: delete
  system_keys:
    inventory: i
    status: s
    chat: enter
automation:
  action_delay: 0.3
  scan_interval: 0.1
  max_detection_distance: 200
  priority_targets:
  - mob
  mob_hunting:
    enable: true
    search_pattern: horizontal
    move_distance: 100
    search_delay: 2.0
    max_search_time: 10
    return_to_center: true
safety:
  enable_failsafe: true
  emergency_stop_corner: true
  max_runtime_hours: 2
  screenshot_log: false
monitoring:
  log_level: INFO
  save_interval: 30
  max_log_size_mb: 100
  enable_performance_monitor: true
detection_behavior:
  confidence_threshold: 0.5
  min_mob_box_px: 20
  detect_only_mobs: true
  center_zone:
    enabled: true
    width_fraction: 0.6
    height_fraction: 0.6
  character:
    action: ignore
    log: true
  environment:
    action: ignore
    log: false
  item:
    action: ignore
    log: true
    max_distance: 150
  mob:
    action: attack
    log: true
    max_distance: 200
    attack_delay: 0.5
  npc:
    action: ignore
    log: true
    interaction_delay: 1.0
  ui:
    action: ignore
    log: false
